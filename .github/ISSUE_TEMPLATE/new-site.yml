name: 申请收录新工具
description: 推荐一个 AI 工具，图标库没有的品牌也可以直接提交（会自动抓取官网图标）
title: '[New Site] '
labels: ['data', 'new-site']
body:
  - type: markdown
    attributes:
      value: |
        感谢你推荐新工具！请尽量填全，信息越完整合并越快。

        **两条收录路径**：
        1. 该品牌已被图标库收录 → 在 https://lobehub.com/icons 找到图标 ID 填入下方；
        2. 图标库还没有该品牌 → **无需等待图标**，留空图标 ID 即可，
           维护者会把条目加入 `data/catalog/` 并运行 `pnpm fetch:favicons` 抓取官网图标。

  - type: input
    id: name
    attributes:
      label: 工具名称
      description: 官方英文名，例如 `Perplexity`
      placeholder: Perplexity
    validations:
      required: true

  - type: input
    id: name-cn
    attributes:
      label: 中文名（可选）
      placeholder: Perplexity

  - type: input
    id: url
    attributes:
      label: 官网地址
      description: 必须是 https 开头，且不含 utm / ref 等追踪参数
      placeholder: https://www.perplexity.ai
    validations:
      required: true

  - type: input
    id: icon-id
    attributes:
      label: 图标 ID（可选）
      description: 若 https://lobehub.com/icons 已收录该品牌，填入 PascalCase 图标 id；没有就留空，我们会抓取官网图标
      placeholder: Perplexity

  - type: input
    id: github
    attributes:
      label: 开源仓库（可选）
      description: 形如 `owner/repo`，填写后会定期同步 GitHub Star 数（仅使用公开客观数据）
      placeholder: ollama/ollama

  - type: select
    id: category
    attributes:
      label: 所属分类
      options:
        - chat（AI 对话助手）
        - code（AI 编程开发）
        - image（图像与设计）
        - video（视频与音频）
        - agent（Agent 与自动化）
        - search（搜索与知识）
        - writing（写作与办公）
        - opensource（开源与社区）
        - infra（云平台与基础设施）
        - model（大模型与 API）
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 一句话简介
      description: 10–80 字，客观陈述这个工具做什么，避免「最强 / 第一」等营销表述
      placeholder: 带引用来源的 AI 搜索引擎，答案可追溯原文链接。
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 从 data/tags.json 中选择，用英文逗号分隔，建议 1–4 个
      placeholder: ai-search, chatbot

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认该官网地址可达，且信息真实客观
          required: true
        - label: 我愿意按贡献指南自行提交 PR（可选，勾选后可直接改 JSON 提 PR）
          required: false
