name: 功能建议
description: 提出新功能或改进建议（涉及数据字段变更需同步 spec）
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说问题，再说方案，帮助我们理解真实诉求
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它长什么样、怎么用
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案（可选）

  - type: checkboxes
    id: spec
    attributes:
      label: 影响范围
      options:
        - label: 本建议涉及数据字段变更（需同步 docs/spec/10-data-model.md）
        - label: 我愿意自行提交 PR 实现
